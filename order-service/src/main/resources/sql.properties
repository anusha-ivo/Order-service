order.insert=INSERT INTO orders (customer_id, status, total_amount, currency, payment_id, shipping_address) VALUES (?, ?, ?, ?, ?, ?::jsonb) RETURNING order_id
orderitem.insert=INSERT INTO order_items (order_id, product_id, product_name_snapshot, unit_price_snapshot, quantity, line_total) VALUES (?, ?, ?, ?, ?, ?)

order.findById=SELECT * FROM orders WHERE order_id = ?

orderitem.findByOrderId=SELECT * FROM order_items WHERE order_id = ?

order.updateStatus=UPDATE orders SET status = ?, updated_at = CURRENT_TIMESTAMP WHERE order_id = ?

order.updatePayment=UPDATE orders SET payment_id = ?, updated_at = CURRENT_TIMESTAMP WHERE order_id = ?

order.updateTotal=UPDATE orders SET total_amount = ?, updated_at = CURRENT_TIMESTAMP WHERE order_id = ?